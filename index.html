<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15130f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Our Companies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="companies.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <!-- Founder first, then the companies -->
  <header class="hero">
    <div class="wrap">
      <div class="topbar"><div class="lang" id="lang" role="group" aria-label="Language"></div></div>
      <section class="founder" id="founder">
        <p class="eyebrow" id="founder-eyebrow"></p>
        <div class="founder-grid">
          <a class="founder-photo" id="founder-photo" target="_blank" rel="noopener"><img alt="" id="founder-img"></a>
          <div class="founder-text">
            <blockquote id="founder-quote"></blockquote>
            <img class="signature" id="founder-sign" alt="">
            <p class="founder-name" id="founder-name"></p>
            <p class="founder-title" id="founder-title"></p>
            <a class="text-link" id="founder-full" target="_blank" rel="noopener"></a>
          </div>
        </div>
      </section>
      <div class="hero-ctas"><a class="btn btn-gold" href="#companies" id="cta-explore"></a></div>
    </div>
  </header>

  <main class="wrap companies" id="companies">
    <p class="eyebrow" id="eyebrow"></p>
    <h2 id="headline"></h2>
    <p class="lead" id="lead"></p>
    <nav class="cards" id="cards"></nav>
  </main>

  <!-- Same scan block as qr.html, so the home page doubles as the QR page -->
  <section class="scan" id="scan">
    <p class="eyebrow" lang="en">Our Companies</p>
    <h2 class="scan-title" lang="en">Scan to <em>discover</em><br>our companies</h2>
    <p class="ar" lang="ar">امسح الرمز لاكتشاف شركاتنا</p>
    <p class="tr" lang="tr">Şirketlerimizi keşfetmek için okutun</p>
    <div class="qr-zone">
      <div id="qr" role="img" aria-label="QR code to this website"></div>
      <i class="bracket b1"></i><i class="bracket b2"></i><i class="bracket b3"></i><i class="bracket b4"></i>
    </div>
    <div class="chips"><span lang="en">English</span><span lang="ar">العربية</span><span lang="tr">Türkçe</span></div>
  </section>
  <footer class="footer" id="footer"></footer>
  <script>
    startPage((lang, t) => {
      document.title = t.title;
      renderFounder(lang, t);
      document.getElementById("cta-explore").innerHTML = `${t.explore} <span aria-hidden="true">↓</span>`;
      document.getElementById("eyebrow").textContent = t.title;
      document.getElementById("headline").textContent = t.headline;
      document.getElementById("lead").textContent = t.subtitle;
      document.getElementById("cards").innerHTML = COMPANIES.map((c, i) => `
        <a class="card" style="--co:${c.accent}" href="company.html?id=${encodeURIComponent(c.id)}&lang=${lang}">
          <span class="logo-panel"><img src="${c.logo}" alt=""></span>
          <span class="card-body">
            <span class="card-index">0${i + 1}</span>
            <h3>${c.name[lang]}</h3>
            <p>${c.sector[lang]}</p>
            <span class="cta">${t.view} <span class="arr" aria-hidden="true">→</span></span>
          </span>
        </a>`).join("");
    });
  </script>
  <script>
    // Separate script so a failed QR library load can't break the rest of the page.
    const qr = qrcode(0, "Q"); // Q = ~25% error correction
    qr.addData(new URL("./", location.href).href); // the site's home address, without ?lang
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  </script>
</body>
</html>
