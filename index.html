<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15130f">
  <title>Our Companies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="companies.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="topbar"><div class="lang" id="lang" role="group" aria-label="Language"></div></div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="headline"></h1>
      <p class="lead" id="lead"></p>
      <div class="hero-ctas">
        <a class="btn btn-gold" href="#companies" id="cta-explore"></a>
        <a class="btn btn-ghost" href="#founder" id="cta-founder"></a>
      </div>
    </div>
  </header>
  <main>
    <div class="wrap"><nav class="cards" id="companies"></nav></div>

    <section class="founder" id="founder">
      <div class="wrap founder-grid">
        <a class="founder-photo" id="founder-photo" target="_blank" rel="noopener"><img alt="" id="founder-img"></a>
        <div class="founder-text">
          <p class="eyebrow" id="founder-eyebrow"></p>
          <blockquote id="founder-quote"></blockquote>
          <img class="signature" id="founder-sign" alt="">
          <p class="founder-name" id="founder-name"></p>
          <p class="founder-title" id="founder-title"></p>
          <a class="text-link" id="founder-full" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script>
    startPage((lang, t) => {
      document.title = t.title;
      document.getElementById("eyebrow").textContent = t.title;
      document.getElementById("headline").textContent = t.headline;
      document.getElementById("lead").textContent = t.subtitle;
      document.getElementById("cta-explore").textContent = t.explore;
      document.getElementById("cta-founder").textContent = t.founderLink;

      const f = FOUNDER, $ = id => document.getElementById(id);
      $("founder-photo").href = f.poster;
      $("founder-img").src = f.photo;
      $("founder-img").alt = f.name[lang];
      $("founder-sign").src = f.signature;
      $("founder-eyebrow").textContent = t.founderEyebrow;
      $("founder-quote").innerHTML = f.quote[lang];
      $("founder-name").textContent = f.name[lang];
      $("founder-title").textContent = f.title[lang];
      $("founder-full").href = f.poster;
      $("founder-full").innerHTML = `${t.fullMessage} <span class="arr" aria-hidden="true">→</span>`;

      document.getElementById("companies").innerHTML = COMPANIES.map((c, i) => `
        <a class="card" style="--co:${c.accent}" href="company.html?id=${encodeURIComponent(c.id)}&lang=${lang}">
          <span class="logo-panel"><img src="${c.logo}" alt=""></span>
          <span class="card-body">
            <span class="card-index">0${i + 1}</span>
            <h2>${c.name[lang]}</h2>
            <p>${c.sector[lang]}</p>
            <span class="cta">${t.view} <span class="arr" aria-hidden="true">→</span></span>
          </span>
        </a>`).join("");
    });
  </script>
</body>
</html>
