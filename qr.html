<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15130f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Scan to discover our companies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="companies.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    /* Same look as the printed QR card (print/qr-card.html) */
    body {
      min-height: 100vh; color: var(--ink-text);
      background: radial-gradient(70% 45% at 50% 40%, rgba(201, 165, 92, .14), transparent 70%),
                  radial-gradient(120% 80% at 50% 0%, #2b2519 0%, var(--ink) 65%) fixed;
    }
    .qr-card { position: relative; max-width: 560px; margin: 0 auto; padding: 44px 32px 40px; text-align: center; }
    .qr-card::before, .qr-card::after { content: ""; position: absolute; pointer-events: none; border: 1px solid var(--accent); }
    .qr-card::before { inset: 12px; opacity: .5; }
    .qr-card::after { inset: 19px; opacity: .2; }
    .diamond { position: absolute; width: 10px; height: 10px; background: var(--accent); transform: rotate(45deg); }
    .d1 { top: 7px; left: 7px; } .d2 { top: 7px; right: 7px; } .d3 { bottom: 7px; left: 7px; } .d4 { bottom: 7px; right: 7px; }

    .qr-card .eyebrow { margin: 18px 0 12px; }

    /* Compact founder block at the top */
    .qr-card .lang { margin-top: 6px; }
    .qr-card .founder .eyebrow { margin: 22px 0 22px; }
    .qr-card .founder-grid { gap: 30px; grid-template-columns: 1fr; } /* card is narrow even on desktop */
    .qr-card .founder-photo { width: min(200px, 58%); }
    .qr-card .founder blockquote { font-size: 1.35rem; }
    [lang="ar"] .qr-card .founder blockquote { font-size: 1.2rem; }
    .qr-card .founder blockquote::before { font-size: 3.6rem; }
    .qr-card .founder-text { text-align: center; }
    .qr-card .signature { width: 140px; margin-inline: auto; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 38px 0 10px; color: var(--accent); }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .4; }
    .divider i { width: 8px; height: 8px; background: currentColor; transform: rotate(45deg); }
    h1 { font: 500 clamp(2.1rem, 8.5vw, 3rem)/1.05 var(--serif); margin: 0; }
    h1 em { color: var(--accent); }
    .ar { margin: 14px 0 0; font: 700 1.3rem/1.5 "Tajawal", sans-serif; direction: rtl; }
    .tr { margin: 2px 0 0; color: var(--ink-muted); font-size: .95rem; }

    .qr-zone { position: relative; width: min(290px, 74vw); aspect-ratio: 1; margin: 40px auto 0; }
    #qr {
      width: 100%; height: 100%; padding: 9%; background: #fff; border-radius: 18px;
      box-shadow: 0 0 0 7px rgba(201, 165, 92, .14), 0 24px 60px -18px rgba(0, 0, 0, .8);
    }
    #qr svg { display: block; width: 100%; height: 100%; }
    .bracket { position: absolute; width: 46px; height: 46px; border: 0 solid var(--accent); }
    .b1 { top: -20px; left: -20px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 14px; }
    .b2 { top: -20px; right: -20px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 14px; }
    .b3 { bottom: -20px; left: -20px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 14px; }
    .b4 { bottom: -20px; right: -20px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 14px; }

    .chips { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
    .chips span { padding: 5px 14px; border: 1px solid rgba(201, 165, 92, .55); border-radius: 999px; color: var(--accent); font-size: .85rem; font-weight: 600; }
    .chips span[lang="ar"] { font-family: "Tajawal", sans-serif; font-weight: 700; }

    .go { margin-top: 26px; padding: 15px 30px; font-size: 1rem; }
    .downloads { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
    .downloads button { font: 600 .85rem var(--sans); cursor: pointer; background: transparent; }

    .logos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 34px; }
    .logos a { display: block; aspect-ratio: 16 / 10; padding: 10px; background: #fff; border-radius: 12px; border-bottom: 4px solid var(--co); transition: transform .2s; }
    .logos a:hover { transform: translateY(-3px); }
    .logos img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .url { margin: 26px 0 0; color: var(--ink-muted); font-size: .8rem; letter-spacing: .08em; word-break: break-all; }
    details { margin-top: 18px; color: var(--ink-muted); font-size: .8rem; }
    summary { cursor: pointer; }
    details input {
      width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 10px; font: inherit; font-size: .85rem;
      border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .05); color: var(--ink-text);
    }
  </style>
</head>
<body>
  <main class="qr-card">
    <i class="diamond d1"></i><i class="diamond d2"></i><i class="diamond d3"></i><i class="diamond d4"></i>

    <div class="lang" id="lang" role="group" aria-label="Language"></div>
    <section class="founder">
      <p class="eyebrow" id="founder-eyebrow"></p>
      <div class="founder-grid">
        <a class="founder-photo" id="founder-photo" target="_blank" rel="noopener"><img alt="" id="founder-img"></a>
        <div class="founder-text">
          <blockquote id="founder-quote"></blockquote>
          <img class="signature" id="founder-sign" alt="">
          <p class="founder-name" id="founder-name"></p>
          <p class="founder-title" id="founder-title"></p>
          <a class="text-link" id="founder-full" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>
    <div class="divider" aria-hidden="true"><i></i></div>

    <p class="eyebrow" lang="en">Our Companies</p>
    <h1 lang="en">Scan to <em>discover</em><br>our companies</h1>
    <p class="ar" lang="ar">امسح الرمز لاكتشاف شركاتنا</p>
    <p class="tr" lang="tr">Şirketlerimizi keşfetmek için okutun</p>

    <div class="qr-zone">
      <div id="qr" role="img" aria-label="QR code to the company portal"></div>
      <i class="bracket b1"></i><i class="bracket b2"></i><i class="bracket b3"></i><i class="bracket b4"></i>
    </div>

    <div class="chips"><span lang="en">English</span><span lang="ar">العربية</span><span lang="tr">Türkçe</span></div>

    <a class="btn btn-gold go" id="go" lang="en" href="./">Go to the website <span class="arr" aria-hidden="true">→</span></a>
    <div class="downloads" lang="en">
      <button class="btn btn-ghost" id="png">Download PNG</button>
      <button class="btn btn-ghost" id="svg">Download SVG (for print)</button>
    </div>

    <nav class="logos" id="logos" aria-label="Our companies"></nav>

    <p class="url" id="url-text" lang="en"></p>
    <details lang="en">
      <summary>Change QR address</summary>
      <input id="url" type="url" aria-label="Portal address">
    </details>
  </main>
  <script>
    const input = document.getElementById("url");
    // Default: the index page next to this file, i.e. wherever the site is hosted.
    input.value = new URL("index.html", location.href).href.replace(/index\.html$/, "");
    let qr;

    document.getElementById("logos").innerHTML = COMPANIES.map(c =>
      `<a href="company.html?id=${encodeURIComponent(c.id)}" style="--co:${c.accent}"><img src="${c.logo}" alt="${c.name.en}"></a>`).join("");

    const render = () => {
      const url = input.value.trim();
      qr = qrcode(0, "Q"); // Q = ~25% error correction, survives print wear
      qr.addData(url);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      document.getElementById("go").href = url; // same address the QR opens
      document.getElementById("url-text").textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    };

    const download = (href, name) => Object.assign(document.createElement("a"), { href, download: name }).click();

    document.getElementById("svg").onclick = () => {
      const blob = new Blob([qr.createSvgTag({ cellSize: 20, margin: 4 })], { type: "image/svg+xml" });
      download(URL.createObjectURL(blob), "portal-qr.svg");
    };

    document.getElementById("png").onclick = () => {
      const n = qr.getModuleCount(), margin = 4, scale = Math.ceil(1200 / (n + margin * 2));
      const canvas = Object.assign(document.createElement("canvas"), { width: (n + margin * 2) * scale, height: (n + margin * 2) * scale });
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
      download(canvas.toDataURL("image/png"), "portal-qr.png");
    };

    input.addEventListener("input", render);
    render();
    startPage(renderFounder); // language switch drives the founder message
  </script>
</body>
</html>
